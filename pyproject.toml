[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ready"
version = "0.1.0"
description = "Check a research dataset against Zenodo, Dryad, Figshare and NIH DMS requirements before deposit."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
dev = ["pytest>=7", "openpyxl>=3.0"]

[project.scripts]
data-ready = "data_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_ready = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
