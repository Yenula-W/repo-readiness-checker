name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          data-ready targets
          data-ready check tests/fixtures/good_dataset -t zenodo -t figshare -t nih-dms --strict
